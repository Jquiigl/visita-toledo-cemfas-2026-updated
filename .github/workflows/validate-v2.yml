name: Toledo Updated · Pruebas y construcción

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toledo-v2-checks
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Jquiigl/visita-toledo-cemfas-2026-updated'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Probar cálculos y adaptadores
        run: pnpm test
      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit
      - name: Revisar código
        run: pnpm lint
      - name: Construir V2
        run: pnpm build
      - name: Construir frontend Pages
        run: pnpm build:pages
      - name: Compilar funciones de Pages
        run: pnpm exec wrangler pages functions build --outdir .pages-functions
  database:
    if: github.repository == 'Jquiigl/visita-toledo-cemfas-2026-updated'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: toledo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Probar migración y RLS en PostgreSQL efímero
        run: |
          psql -h localhost -U postgres -d toledo_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap-ci.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d toledo_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U postgres -d toledo_test -v ON_ERROR_STOP=1 -f supabase/tests/rls.sql
