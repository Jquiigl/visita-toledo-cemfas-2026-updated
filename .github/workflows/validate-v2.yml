name: Toledo Updated · Pruebas y construcción

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toledo-v2-checks
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Jquiigl/visita-toledo-cemfas-2026-updated'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Probar cálculos y adaptadores
        run: pnpm test
      - name: Comprobar tipos
        run: pnpm exec tsc --noEmit
      - name: Revisar código
        run: pnpm lint
      - name: Construir V2
        run: pnpm build
